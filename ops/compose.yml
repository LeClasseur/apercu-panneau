# Collecte des avis et de la telemetrie de la page d'essai (mad-server). Mode d'emploi : ../README.md.
name: apercu-panneau
services:
  app:
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"
    security_opt:
      - no-new-privileges:true
    image: python:3.12-slim
    container_name: apercu-panneau-app
    user: "1000:1000"
    read_only: true
    working_dir: /app
    command: [python3, /app/server.py]
    environment:
      DATA_DIR: /data
      PUBLIC_PORT: "8080"
      PRIVATE_PORT: "8081"
      ALLOWED_ORIGINS: https://leclasseur.github.io
    volumes:
      - ../server:/app:ro
      - /home/mad/.local/share/apercu-panneau:/data
    ports:
      # 8081 : resultats, Tailscale et la machine seulement.
      - 100.118.62.120:8098:8081
      - 127.0.0.1:18098:8081
      # 8080 : porte publique, machine seulement ; Tailscale Funnel n'y publie que /api (voir README).
      - 127.0.0.1:18100:8080
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    cpus: 0.5
