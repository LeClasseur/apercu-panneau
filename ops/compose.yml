# Collecte des avis et de la telemetrie de la page d'essai (mad-server). Mode d'emploi : ../README.md.
name: apercu-panneau
x-service: &service
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: 5m
      max-file: "2"
  security_opt:
    - no-new-privileges:true
services:
  app:
    <<: *service
    image: python:3.12-slim
    container_name: apercu-panneau-app
    user: "1000:1000"
    read_only: true
    working_dir: /app
    command: [python3, /app/server.py]
    environment:
      DATA_DIR: /data
      PUBLIC_PORT: "8080"
      PRIVATE_PORT: "8081"
      ALLOWED_ORIGINS: https://leclasseur.github.io
    volumes:
      - ../server:/app:ro
      - /home/mad/.local/share/apercu-panneau:/data
    ports:
      # 8081 : resultats, Tailscale et la machine seulement. 8080 : porte publique, atteinte par cloudflared seulement.
      - 100.118.62.120:8098:8081
      - 127.0.0.1:18098:8081
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    cpus: 0.5
  cloudflared:
    <<: *service
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    container_name: apercu-panneau-cloudflared
    user: "1000:1000"
    read_only: true
    # Tunnel dedie apercu-panneau (cloudflare.py) : seulement /api/* -> app:8080.
    command: [tunnel, --no-autoupdate, --loglevel, error, run, --token-file, /run/secrets/tunnel-token]
    volumes:
      - /home/mad/.config/apercu-panneau/cloudflared-token:/run/secrets/tunnel-token:ro
    depends_on: [app]
    mem_limit: 128m
    cpus: 0.25
